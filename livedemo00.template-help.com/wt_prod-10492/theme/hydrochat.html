<!DOCTYPE html>
<html lang="en">
  
<!-- Mirrored from livedemo00.template-help.com/wt_prod-10492/theme/index.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 17 Jun 2026 15:35:07 GMT -->
<head>
  <title>Hydronexis</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="icon" href="images/futurehydri.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="stylesheet" href="css/hydrochat.css">
</head>


<body>

    <!-- =====================================================
         HYDROCHAT
    ====================================================== -->

    <main class="hydrochat-app">


        <!-- =================================================
             LEFT PANEL
        ================================================== -->

        <aside
            class="hydrochat-sidebar"
            id="hydrochatSidebar"
        >


            <!-- HYDROCHAT BRAND IMAGE -->
            <div class="hydrochat-brand">

                <a href="index.html" class="hydrochat-brand-link">
                    <img
                        src="images/hydrochat.png"
                        alt="HydroNexis Marketplace - HydroChat"
                        class="hydrochat-brand-image"
                    >
                </a>

            </div>


            <!-- SEARCH -->

            <div class="hydrochat-search">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle
                        cx="11"
                        cy="11"
                        r="8"
                    ></circle>

                    <path
                        d="m21 21-4.3-4.3"
                    ></path>
                </svg>


                <input
                    type="search"
                    id="chatSearch"
                    placeholder="Search products or sellers"
                    autocomplete="off"
                >

            </div>



            <!-- FILTERS -->

            <div
                class="hydrochat-filters"
                id="chatFilters"
            >

                <button
                    type="button"
                    class="hydrochat-filter active"
                    data-filter="all"
                >
                    All
                </button>


                <button
                    type="button"
                    class="hydrochat-filter"
                    data-filter="vegetables"
                >
                    Vegetables
                </button>


                <button
                    type="button"
                    class="hydrochat-filter"
                    data-filter="herbs"
                >
                    Herbs
                </button>

            </div>



            <!-- RESULTS COUNT -->

            <div class="hydrochat-list-label">

                <span>
                    Conversations
                </span>

                <span id="chatCount">
                    0
                </span>

            </div>



            <!-- CONTACTS GENERATED BY JS -->

            <div
                class="hydrochat-contact-list"
                id="chatContactList"
            ></div>


        </aside>



        <!-- =================================================
             CONVERSATION PANEL
        ================================================== -->

        <section
            class="hydrochat-conversation"
            id="hydrochatConversation"
        >


            <!-- EMPTY STATE -->

            <div
                class="hydrochat-empty-state"
                id="emptyState"
            >

                <div class="empty-state-circle">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"
                        ></path>
                    </svg>

                </div>

                <h2>
                    HydroChat
                </h2>

                <p>
                    Select a product or seller to start a conversation.
                </p>

            </div>



            <!-- ACTIVE CHAT -->

            <div
                class="hydrochat-active-chat"
                id="activeChat"
                hidden
            >


                <!-- HEADER -->

                <header class="conversation-header">


                    <button
                        type="button"
                        class="conversation-back"
                        id="conversationBack"
                        aria-label="Back to conversations"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="m15 18-6-6 6-6"></path>
                        </svg>

                    </button>



                    <div
                        class="conversation-avatar"
                        id="conversationAvatar"
                    >

                        <img
                            id="conversationAvatarImage"
                            src=""
                            alt=""
                        >

                        <span
                            id="conversationAvatarFallback"
                        ></span>

                    </div>



                    <div class="conversation-heading">

                        <h2 id="conversationSeller">
                            Seller
                        </h2>

                        <p>

                            <span id="conversationProduct">
                                Product
                            </span>

                            <span class="heading-separator">
                                •
                            </span>

                            <span id="conversationPrice">
                                $0.00/lb
                            </span>

                        </p>

                    </div>

                </header>



                <!-- MESSAGES -->

                <div
                    class="conversation-messages"
                    id="conversationMessages"
                ></div>



                <!-- MESSAGE INPUT -->

                <form
                    class="conversation-compose"
                    id="messageForm"
                >

                    <div class="compose-input-wrapper">

                        <textarea
                            id="messageInput"
                            rows="1"
                            maxlength="1000"
                            placeholder="Type a message"
                            autocomplete="off"
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="send-message-button"
                        aria-label="Send message"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M22 2 11 13"
                            ></path>

                            <path
                                d="m22 2-7 20-4-9-9-4Z"
                            ></path>
                        </svg>

                    </button>

                </form>


            </div>


        </section>


    </main>


    <script type="module" src="js/hydrochat.js"></script>

</body>

</html>
